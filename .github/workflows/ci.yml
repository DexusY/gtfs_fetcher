name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    env:
      # Dummy values — tests never open a real DB connection or check auth
      # against a real secret (main.py just requires JWT_SECRET to be
      # non-empty and non-default at import time).
      JWT_SECRET: ci-test-secret-not-for-production
      DATABASE_URL: postgresql+asyncpg://admin:test@localhost:5432/gtfs_app
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends gcc make libc6-dev

      - name: Build C extension
        run: make -C c_modules

      - name: Install Python dependencies
        run: pip install -r backend/requirements.txt

      - name: Run tests
        working-directory: backend
        run: python -m pytest -m "not integration" -v

  frontend:
    name: Frontend build & e2e
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Type-check & build
        working-directory: frontend
        run: npm run build

      - name: Install Playwright browsers
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Run e2e tests
        working-directory: frontend
        run: npm run test:e2e
